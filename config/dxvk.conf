# Copied next to X2.EXE by scripts/install.sh. DXVK reads dxvk.conf from the
# working directory, which Bottles sets to Altium's folder, so this only affects Altium.
#
# The PCB and schematic views are child windows, which Wine renders off-screen and copies
# into the main window after each present (how-it-works.md §11). Without vsync the X
# server copies a frame into the off-screen window as soon as it arrives, instead of at
# its next tick, so the present-wait layer (src/presentwait) waits one tick, not two.
dxgi.syncInterval = 0
