# Copied next to X2.EXE by scripts/install.sh. DXVK reads dxvk.conf from the
# working directory, which Bottles sets to Altium's folder, so this only affects Altium.
#
# The PCB view is a child window. Wine (X11) renders child windows off-screen and
# copies the result into the main window right after each Present. With vsync (FIFO)
# the X server only updates the off-screen image at the next vblank, so Wine copied
# the previous frame: layer switches showed up one step late. Present immediately.
dxgi.syncInterval = 0
